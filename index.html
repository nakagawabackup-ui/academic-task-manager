<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Academic & Research</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { color: #64748b; border-bottom: 2px solid transparent; }
        .tab-inactive:hover { color: #334155; border-bottom: 2px solid #cbd5e1; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .modal-overlay { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-40 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex flex-col">
                <h1 class="text-xl font-bold italic tracking-tight text-slate-900">TASK MANAGER</h1>
                <span class="text-[10px] text-slate-500 font-semibold tracking-wider">ACADEMIC & RESEARCH</span>
            </div>
            
            <div id="auth-section" class="flex items-center">
                <!-- Auth UI will be injected here -->
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-6">
        
        <!-- Navigation Tabs -->
        <div class="glass-panel rounded-xl shadow-sm overflow-hidden flex text-sm font-medium">
            <button onclick="switchTab('timeline')" id="tab-timeline" class="flex-1 py-3.5 text-center tab-active transition-all">
                <i class="fa-regular fa-clock mr-2"></i>タイムライン
            </button>
            <button onclick="switchTab('projects')" id="tab-projects" class="flex-1 py-3.5 text-center tab-inactive transition-all border-l border-slate-100">
                <i class="fa-regular fa-folder-open mr-2 text-amber-500"></i>プロジェクト管理
            </button>
            <button onclick="switchTab('archive')" id="tab-archive" class="flex-1 py-3.5 text-center tab-inactive transition-all border-l border-slate-100">
                <i class="fa-solid fa-server mr-2 text-indigo-500"></i>保管庫 (業績出力)
            </button>
        </div>

        <!-- View Containers -->
        <div id="view-timeline" class="block animate-fade-in">
            <!-- Timeline injected here -->
        </div>
        
        <div id="view-projects" class="hidden animate-fade-in flex-col gap-4">
            <!-- Projects injected here -->
        </div>

        <div id="view-archive" class="hidden animate-fade-in flex-col gap-4">
            <!-- Archives injected here -->
        </div>
    </main>

    <!-- FAB (Add Project) -->
    <button onclick="openProjectModal()" id="fab-add" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-lg hover:shadow-xl transition-all flex items-center justify-center text-2xl z-30">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Project Modal -->
    <div id="project-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 id="modal-title" class="text-lg font-bold text-slate-800">新規プロジェクト</h2>
                <button onclick="closeProjectModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto custom-scrollbar flex flex-col gap-5">
                <input type="hidden" id="p-id">
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">プロジェクト名</label>
                    <input type="text" id="p-title" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="例：第31回 留学生教育学会 年次大会">
                </div>

                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-semibold text-slate-700 mb-1">種類</label>
                        <select id="p-type" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                            <option value="conference">学会発表</option>
                            <option value="paper">論文投稿</option>
                            <option value="grant">研究助成（科研費など）</option>
                            <option value="custom">任意プロジェクト</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-semibold text-slate-700 mb-1">基準日（〆切/本番）</label>
                        <input type="date" id="p-date" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>
                </div>

                <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <p class="text-xs text-blue-800"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>種類と基準日を設定すると、標準的な準備タスクが自動的に逆算・生成されます。</p>
                </div>
            </div>

            <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-3 bg-slate-50/50">
                <button onclick="closeProjectModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">キャンセル</button>
                <button onclick="saveProject()" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm">保存してタスク生成</button>
            </div>
        </div>
    </div>

    <!-- Project Details Modal -->
    <div id="detail-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-start bg-slate-50/50">
                <div>
                    <span id="d-badge" class="text-xs px-2 py-1 rounded font-medium bg-slate-100 text-slate-600 mb-2 inline-block">カテゴリ</span>
                    <h2 id="d-title" class="text-xl font-bold text-slate-800 leading-tight">プロジェクト名</h2>
                    <p id="d-date" class="text-sm text-slate-500 mt-1"><i class="fa-regular fa-calendar mr-1"></i>基準日: -</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="deleteProject()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors" title="削除">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                    <button onclick="closeDetailModal()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-colors">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
            </div>
            
            <div class="p-0 overflow-y-auto custom-scrollbar flex flex-col bg-slate-50">
                <!-- Progress -->
                <div class="px-6 py-4 bg-white border-b border-slate-100">
                    <div class="flex justify-between text-xs font-semibold mb-1">
                        <span class="text-slate-500">進捗状況</span>
                        <span id="d-progress-text" class="text-blue-600">0%</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2">
                        <div id="d-progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Tasks -->
                <div class="px-6 py-4">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-bold text-slate-700">タスク一覧</h3>
                        <button onclick="addNewTask()" class="text-xs text-blue-600 hover:text-blue-800 font-medium"><i class="fa-solid fa-plus mr-1"></i>タスク追加</button>
                    </div>
                    <div id="d-tasks" class="flex flex-col gap-2">
                        <!-- Tasks list -->
                    </div>
                </div>

                <!-- Resources (Files & Links) -->
                <div class="px-6 py-4 bg-white border-y border-slate-100">
                    <h3 class="text-sm font-bold text-slate-700 mb-3">リソース・添付ファイル</h3>
                    <div id="d-resources" class="flex flex-col gap-2 mb-3">
                        <!-- Links/Files list -->
                    </div>
                    <div id="d-resource-actions" class="flex gap-2">
                        <button onclick="addLink()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded font-medium transition-colors border border-slate-200">
                            <i class="fa-solid fa-link mr-1"></i>リンク追加
                        </button>
                        <!-- Admin Only Button -->
                        <button id="btn-admin-upload" onclick="mockUploadFile()" class="hidden text-xs bg-purple-50 hover:bg-purple-100 text-purple-700 px-3 py-1.5 rounded font-medium transition-colors border border-purple-200">
                            <i class="fa-solid fa-cloud-arrow-up mr-1"></i>ファイルUP (管理者用)
                        </button>
                    </div>
                </div>

                <!-- Completion Action (Shown only at 100%) -->
                <div id="d-completion-zone" class="px-6 py-6 flex justify-center hidden">
                    <button onclick="archiveProject()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 flex items-center">
                        <i class="fa-solid fa-flag-checkered mr-2"></i>全タスク完了：保管庫へ移動
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        Notification
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // State
        let projects = [];
        let currentTab = 'projects';
        let currentEditingId = null;
        let currentUser = null;
        let isAdmin = false;
        const ADMIN_EMAIL = 'admin@example.com'; // このアドレスの時だけ管理者機能ON

        // Firebase Setup (Environment variables check)
        let app, auth;
        const hasFirebaseConfig = typeof __firebase_config !== 'undefined' && __firebase_config;
        
        if (hasFirebaseConfig) {
            try {
                const firebaseConfig = JSON.parse(__firebase_config);
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
            } catch (e) {
                console.warn("Firebase Init Error", e);
            }
        }

        // --- Mock Data Initialization ---
        function initMockData() {
            if (projects.length > 0) return;
            const today = new Date();
            const addDays = (d, days) => {
                const nd = new Date(d);
                nd.setDate(nd.getDate() + days);
                return nd.toISOString().split('T')[0];
            };
            const tStr = today.toISOString().split('T')[0];

            projects = [
                {
                    id: 'mock1', title: '第31回 留学生教育学会 年次大会', type: 'conference', targetDate: addDays(today, 30), status: 'active',
                    tasks: [
                        { id: 't1', title: '抄録提出', date: addDays(today, -30), completed: true },
                        { id: 't2', title: 'スライド作成', date: addDays(today, 16), completed: false },
                        { id: 't3', title: '出張手続き（中川・横田）', date: addDays(today, 20), completed: false }
                    ],
                    links: []
                },
                {
                    id: 'mock2', title: '言語政策学会 論文投稿', type: 'paper', targetDate: addDays(today, -5), status: 'archived',
                    tasks: [
                        { id: 't4', title: 'データ分析', date: addDays(today, -60), completed: true },
                        { id: 't5', title: '初稿完成', date: addDays(today, -30), completed: true },
                        { id: 't6', title: '投稿完了', date: addDays(today, -5), completed: true }
                    ],
                    links: [{ title: 'ジャーナル要項', url: 'https://example.com' }]
                }
            ];
        }

        // --- Auth UI & Logic ---
        function updateAuthUI() {
            const authSection = document.getElementById('auth-section');
            if (currentUser) {
                const badgeClass = isAdmin ? 'bg-purple-100 text-purple-800 border-purple-200' : 'bg-slate-100 text-slate-800 border-slate-200';
                const roleText = isAdmin ? '管理者(ファイルUP可)' : '一般ユーザー';
                authSection.innerHTML = `
                    <div class="flex items-center gap-2">
                        <div class="text-right hidden sm:block">
                            <div class="text-[10px] text-slate-500 leading-none">${currentUser.email}</div>
                            <div class="text-[10px] border ${badgeClass} px-1.5 py-0.5 rounded mt-0.5 inline-block font-medium">
                                <i class="fa-solid ${isAdmin ? 'fa-user-shield' : 'fa-user'} mr-1"></i>${roleText}
                            </div>
                        </div>
                        <button onclick="window.signOutUser()" class="text-slate-400 hover:text-slate-600 ml-1 p-1" title="ログアウト">
                            <i class="fa-solid fa-right-from-bracket text-lg"></i>
                        </button>
                    </div>
                `;
            } else {
                authSection.innerHTML = `
                    <button onclick="window.signInWithGoogle()" class="text-xs bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-3 py-1.5 rounded shadow-sm font-medium transition-colors flex items-center">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-4 h-4 mr-1.5" alt="G">
                        Googleでログイン
                    </button>
                `;
            }
        }

        window.signInWithGoogle = async function() {
            if (!auth) {
                // Firebase未設定時はモック（テスト用）ログイン
                currentUser = { email: ADMIN_EMAIL, uid: 'mock-admin' };
                isAdmin = true;
                showToast("【デモ】管理者としてログインしました");
                updateAuthUI();
                renderApp();
                return;
            }
            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                currentUser = result.user;
                isAdmin = (currentUser.email === ADMIN_EMAIL);
                showToast("ログインしました");
                updateAuthUI();
                renderApp();
            } catch (error) {
                console.error("Login Error:", error);
                showToast("ログインに失敗しました");
            }
        };

        window.signOutUser = async function() {
            if (!auth) {
                currentUser = null;
                isAdmin = false;
                showToast("ログアウトしました");
                updateAuthUI();
                renderApp();
                return;
            }
            try {
                await signOut(auth);
                currentUser = null;
                isAdmin = false;
                showToast("ログアウトしました");
                updateAuthUI();
                renderApp();
            } catch (error) {
                console.error("Logout Error:", error);
            }
        };

        // --- Helpers ---
        function getTypeId() { return Math.random().toString(36).substring(2, 9); }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 3000);
        }
        function getTypeLabel(type) {
            const types = { conference: '学会発表', paper: '論文投稿', grant: '研究助成', custom: '任意' };
            return types[type] || type;
        }
        function getTypeColor(type) {
            const colors = { 
                conference: 'bg-blue-100 text-blue-800', 
                paper: 'bg-emerald-100 text-emerald-800', 
                grant: 'bg-amber-100 text-amber-800', 
                custom: 'bg-slate-100 text-slate-800' 
            };
            return colors[type] || colors.custom;
        }

        // --- Core Logic ---
        window.switchTab = function(tab) {
            currentTab = tab;
            ['timeline', 'projects', 'archive'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const view = document.getElementById(`view-${t}`);
                if (t === tab) {
                    btn.className = btn.className.replace('tab-inactive', 'tab-active').replace('border-b-transparent', 'border-b-[#2563eb]');
                    view.classList.remove('hidden');
                    view.classList.add('flex');
                } else {
                    btn.className = btn.className.replace('tab-active', 'tab-inactive').replace('border-b-[#2563eb]', 'border-b-transparent');
                    view.classList.add('hidden');
                    view.classList.remove('flex');
                }
            });
            document.getElementById('fab-add').style.display = tab === 'archive' ? 'none' : 'flex';
            renderApp();
        };

        // 自動逆算ロジック
        function generateAutoTasks(type, targetDateStr) {
            if (!targetDateStr || type === 'custom') return [];
            const target = new Date(targetDateStr);
            const addD = (days) => {
                const d = new Date(target);
                d.setDate(d.getDate() + days);
                return d.toISOString().split('T')[0];
            };
            
            if (type === 'conference') {
                return [
                    { id: getTypeId(), title: '抄録・エントリー提出', date: addD(-60), completed: false },
                    { id: selectedId=>getTypeId(), title: 'スライド初稿作成', date: addD(-14), completed: false },
                    { id: getTypeId(), title: '発表練習・修正', date: addD(-7), completed: false }
                ];
            } else if (type === 'paper') {
                return [
                    { id: getTypeId(), title: 'データ分析・図表作成', date: addD(-60), completed: false },
                    { id: getTypeId(), title: '初稿完成・共著者共有', date: addD(-30), completed: false },
                    { id: getTypeId(), title: '最終校正', date: addD(-10), completed: false }
                ];
            } else if (type === 'grant') {
                return [
                    { id: getTypeId(), title: '公募要領確認・骨子作成', date: addD(-60), completed: false },
                    { id: getTypeId(), title: '申請書初稿', date: addD(-30), completed: false },
                    { id: getTypeId(), title: '事務局事前チェック', date: addD(-14), completed: false }
                ];
            }
            return [];
        }

        window.openProjectModal = function() {
            document.getElementById('p-id').value = '';
            document.getElementById('p-title').value = '';
            document.getElementById('p-type').value = 'conference';
            document.getElementById('p-date').value = '';
            document.getElementById('project-modal').classList.remove('hidden');
        };

        window.closeProjectModal = function() {
            document.getElementById('project-modal').classList.add('hidden');
        };

        window.saveProject = function() {
            const title = document.getElementById('p-title').value.trim();
            const type = document.getElementById('p-type').value;
            const date = document.getElementById('p-date').value;
            if (!title) return alert('プロジェクト名を入力してください');

            const newId = getTypeId();
            const tasks = generateAutoTasks(type, date);

            projects.push({
                id: newId,
                title, type, targetDate: date, status: 'active',
                tasks: tasks, links: []
            });
            
            closeProjectModal();
            showToast('プロジェクトを作成しました');
            currentTab = 'projects'; // Force switch to projects
            switchTab('projects');
        };

        window.renderApp = function() {
            renderTimeline();
            renderProjects();
            renderArchive();
        };

        function renderTimeline() {
            const container = document.getElementById('view-timeline');
            container.innerHTML = '';
            
            // Collect all active tasks
            let allTasks = [];
            projects.filter(p => p.status === 'active').forEach(p => {
                p.tasks.forEach(t => {
                    allTasks.push({ ...t, projectId: p.id, projectName: p.title });
                });
            });

            // Sort by date
            allTasks.sort((a, b) => new Date(a.date || '9999-12-31') - new Date(b.date || '9999-12-31'));

            if (allTasks.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-500 py-10">予定されているタスクはありません</div>';
                return;
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'glass-panel rounded-xl shadow-sm overflow-hidden';
            
            const header = document.createElement('div');
            header.className = 'bg-slate-900 text-white text-xs font-semibold px-4 py-3 flex';
            header.innerHTML = '<div class="w-28">期日</div><div class="flex-1">内容 / プロジェクト</div>';
            wrapper.appendChild(header);

            allTasks.forEach(task => {
                const row = document.createElement('div');
                row.className = `flex px-4 py-3 border-b border-slate-100 hover:bg-slate-50 transition-colors cursor-pointer ${task.completed ? 'opacity-50' : ''}`;
                row.onclick = () => openDetailModal(task.projectId);
                
                const dateObj = new Date(task.date);
                const isOverdue = !task.completed && task.date && dateObj < new Date();
                const dateColor = isOverdue ? 'text-red-500 font-bold' : 'text-slate-700';

                row.innerHTML = `
                    <div class="w-28 text-sm ${dateColor} flex items-center">
                        ${task.date || '未定'}
                    </div>
                    <div class="flex-1 flex flex-col justify-center">
                        <div class="text-[10px] text-slate-500 mb-0.5 truncate">${task.projectName}</div>
                        <div class="text-sm font-medium ${task.completed ? 'line-through text-slate-400' : 'text-slate-800'} flex items-center">
                            ${task.completed ? '<i class="fa-solid fa-check text-emerald-500 mr-1.5 text-xs"></i>' : ''}
                            ${task.title}
                        </div>
                    </div>
                `;
                wrapper.appendChild(row);
            });
            container.appendChild(wrapper);
        }

        function renderProjects() {
            const container = document.getElementById('view-projects');
            container.innerHTML = '';
            const activeProjects = projects.filter(p => p.status === 'active');

            if (activeProjects.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-500 py-10 bg-white rounded-xl border border-slate-200 border-dashed">右下の＋ボタンからプロジェクトを追加してください</div>';
                return;
            }

            activeProjects.forEach(p => {
                const total = p.tasks.length;
                const completed = p.tasks.filter(t => t.completed).length;
                const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

                const card = document.createElement('div');
                card.className = 'glass-panel rounded-xl shadow-sm hover:shadow-md transition-shadow cursor-pointer p-5 flex flex-col gap-3';
                card.onclick = () => openDetailModal(p.id);

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] px-2 py-0.5 rounded font-medium ${getTypeColor(p.type)} mb-2 inline-block">${getTypeLabel(p.type)}</span>
                            <h3 class="text-lg font-bold text-slate-800 leading-snug">${p.title}</h3>
                        </div>
                        <div class="text-right">
                            <div class="text-xs font-bold text-slate-500">PROGRESS</div>
                            <div class="text-2xl font-black text-slate-800 tracking-tight">${percent}%</div>
                        </div>
                    </div>
                    
                    <div class="w-full bg-slate-100 rounded-full h-1.5 mt-1">
                        <div class="bg-blue-500 h-1.5 rounded-full" style="width: ${percent}%"></div>
                    </div>
                    
                    <div class="flex justify-between items-center mt-2 text-xs text-slate-500">
                        <div><i class="fa-regular fa-calendar mr-1"></i>基準日: ${p.targetDate || '未設定'}</div>
                        <div>タスク: ${completed}/${total}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.openDetailModal = function(id) {
            const p = projects.find(x => x.id === id);
            if (!p) return;
            currentEditingId = id;
            
            document.getElementById('d-badge').className = `text-xs px-2 py-1 rounded font-medium mb-2 inline-block ${getTypeColor(p.type)}`;
            document.getElementById('d-badge').textContent = getTypeLabel(p.type);
            document.getElementById('d-title').textContent = p.title;
            document.getElementById('d-date').innerHTML = `<i class="fa-regular fa-calendar mr-1"></i>基準日: ${p.targetDate || '未設定'}`;

            // Admin UI toggle
            const adminBtn = document.getElementById('btn-admin-upload');
            if (isAdmin) adminBtn.classList.remove('hidden');
            else adminBtn.classList.add('hidden');

            renderDetailContent();
            document.getElementById('detail-modal').classList.remove('hidden');
        };

        window.closeDetailModal = function() {
            document.getElementById('detail-modal').classList.add('hidden');
            currentEditingId = null;
            renderApp();
        };

        function renderDetailContent() {
            const p = projects.find(x => x.id === currentEditingId);
            if (!p) return;

            const total = p.tasks.length;
            const completed = p.tasks.filter(t => t.completed).length;
            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('d-progress-text').textContent = `${percent}%`;
            document.getElementById('d-progress-bar').style.width = `${percent}%`;

            // Completion Zone Logic
            const compZone = document.getElementById('d-completion-zone');
            if (percent === 100 && total > 0 && p.status === 'active') {
                compZone.classList.remove('hidden');
            } else {
                compZone.classList.add('hidden');
            }

            // Tasks List
            const tContainer = document.getElementById('d-tasks');
            tContainer.innerHTML = '';
            if (p.tasks.length === 0) {
                tContainer.innerHTML = '<div class="text-xs text-slate-400 py-2">タスクがありません</div>';
            } else {
                p.tasks.forEach(t => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center gap-3 bg-white border border-slate-100 p-2.5 rounded-lg shadow-sm';
                    row.innerHTML = `
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${t.id}')" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer">
                        <div class="flex-1 flex flex-col">
                            <span class="text-sm font-medium ${t.completed ? 'line-through text-slate-400' : 'text-slate-700'}">${t.title}</span>
                        </div>
                        <input type="date" value="${t.date || ''}" onchange="updateTaskDate('${t.id}', this.value)" class="text-xs border border-transparent hover:border-slate-200 rounded px-1 py-0.5 outline-none bg-transparent text-slate-500 cursor-pointer w-32">
                        <button onclick="deleteTask('${t.id}')" class="text-slate-300 hover:text-red-500 px-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    `;
                    tContainer.appendChild(row);
                });
            }

            // Resources List
            const rContainer = document.getElementById('d-resources');
            rContainer.innerHTML = '';
            if (!p.links || p.links.length === 0) {
                rContainer.innerHTML = '<div class="text-xs text-slate-400 py-1">添付はありません</div>';
            } else {
                p.links.forEach((l, idx) => {
                    const isFile = l.url.includes('firebasestorage') || l.title.includes('.');
                    const icon = isFile ? 'fa-file-pdf text-red-400' : 'fa-link text-blue-400';
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between text-sm bg-slate-50 border border-slate-100 px-3 py-2 rounded-lg';
                    row.innerHTML = `
                        <a href="${l.url}" target="_blank" class="text-slate-700 hover:text-blue-600 hover:underline truncate flex-1 flex items-center gap-2">
                            <i class="fa-solid ${icon}"></i>${l.title}
                        </a>
                        <button onclick="deleteLink(${idx})" class="text-slate-400 hover:text-red-500 ml-2"><i class="fa-solid fa-xmark"></i></button>
                    `;
                    rContainer.appendChild(row);
                });
            }
        }

        // Action Handlers
        window.toggleTask = function(taskId) {
            const p = projects.find(x => x.id === currentEditingId);
            const t = p.tasks.find(x => x.id === taskId);
            t.completed = !t.completed;
            renderDetailContent();
        };

        window.updateTaskDate = function(taskId, newDate) {
            const p = projects.find(x => x.id === currentEditingId);
            const t = p.tasks.find(x => x.id === taskId);
            t.date = newDate;
            renderDetailContent();
        };

        window.addNewTask = function() {
            const title = prompt('タスク名を入力:');
            if (!title) return;
            const p = projects.find(x => x.id === currentEditingId);
            p.tasks.push({ id: getTypeId(), title, date: '', completed: false });
            renderDetailContent();
        };

        window.deleteTask = function(taskId) {
            if(!confirm('タスクを削除しますか？')) return;
            const p = projects.find(x => x.id === currentEditingId);
            p.tasks = p.tasks.filter(x => x.id !== taskId);
            renderDetailContent();
        };

        window.addLink = function() {
            const url = prompt('URLを入力:');
            if (!url) return;
            const title = prompt('表示名を入力 (省略可):') || 'リンク';
            const p = projects.find(x => x.id === currentEditingId);
            if(!p.links) p.links = [];
            p.links.push({ title, url });
            renderDetailContent();
        };

        window.mockUploadFile = function() {
            // モックのファイルアップロード機能（UIデモ用）
            setTimeout(() => {
                const p = projects.find(x => x.id === currentEditingId);
                if(!p.links) p.links = [];
                p.links.push({ title: 'uploaded_document.pdf', url: '#' });
                showToast('ファイルをアップロードしました');
                renderDetailContent();
            }, 500);
        };

        window.deleteLink = function(idx) {
            const p = projects.find(x => x.id === currentEditingId);
            p.links.splice(idx, 1);
            renderDetailContent();
        };

        window.archiveProject = function() {
            const p = projects.find(x => x.id === currentEditingId);
            p.status = 'archived';
            closeDetailModal();
            showToast('プロジェクトを保管庫に移動しました');
            switchTab('archive');
        };

        window.deleteProject = function() {
            if(!confirm('プロジェクトを完全に削除しますか？\nこの操作は取り消せません。')) return;
            projects = projects.filter(x => x.id !== currentEditingId);
            closeDetailModal();
            showToast('削除しました');
        };

        function renderArchive() {
            const container = document.getElementById('view-archive');
            container.innerHTML = '';
            const archived = projects.filter(p => p.status === 'archived');

            if (archived.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-500 py-10 bg-white rounded-xl border border-slate-200 border-dashed">保管されたプロジェクトはありません</div>';
                return;
            }

            const header = document.createElement('div');
            header.className = 'flex justify-between items-center mb-2 px-2';
            header.innerHTML = `
                <h3 class="text-sm font-bold text-slate-700">完了済みプロジェクト (${archived.length})</h3>
                <button onclick="copyAchievements()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-1.5 rounded flex items-center shadow transition-colors">
                    <i class="fa-regular fa-copy mr-1.5"></i>業績テキスト出力
                </button>
            `;
            container.appendChild(header);

            archived.forEach(p => {
                const card = document.createElement('div');
                card.className = 'glass-panel rounded-xl shadow-sm p-4 flex justify-between items-center border-l-4 border-l-slate-400';
                card.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] px-1.5 py-0.5 rounded font-medium bg-slate-100 text-slate-600 border border-slate-200">${getTypeLabel(p.type)}</span>
                            <span class="text-xs text-slate-500"><i class="fa-regular fa-calendar mr-1"></i>${p.targetDate || '-'}</span>
                        </div>
                        <h3 class="text-sm font-bold text-slate-700 line-through">${p.title}</h3>
                    </div>
                    <button onclick="revertArchive('${p.id}')" class="text-xs text-blue-600 hover:text-blue-800 bg-blue-50 px-2 py-1 rounded font-medium">
                        <i class="fa-solid fa-rotate-left mr-1"></i>戻す
                    </button>
                `;
                container.appendChild(card);
            });
        }

        window.revertArchive = function(id) {
            const p = projects.find(x => x.id === id);
            if(p) {
                p.status = 'active';
                showToast('プロジェクト管理に戻しました');
                renderApp();
            }
        };

        window.copyAchievements = function() {
            const archived = projects.filter(p => p.status === 'archived');
            if (archived.length === 0) return;

            let text = "■ 研究業績・完了プロジェクト一覧\n\n";
            archived.forEach(p => {
                text += `・${getTypeLabel(p.type)}: ${p.title} (${p.targetDate || '時期未定'})\n`;
            });

            // Fallback for copy
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('業績テキストをクリップボードにコピーしました');
            } catch (err) {
                console.error('Copy failed', err);
                alert('コピーに失敗しました。\n\n' + text);
            }
            document.body.removeChild(textarea);
        };

        // Bootstrap
        initMockData();
        updateAuthUI();
        switchTab('projects');

    </script>
</body>
</html>
