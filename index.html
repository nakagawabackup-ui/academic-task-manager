<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研究活動（学会・論文）統合タスク管理ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f8fafc; }
        .tab-active { border-bottom: 4px solid #0f172a; color: #0f172a; font-weight: 900; }
        .tab-inactive { border-bottom: 4px solid transparent; color: #64748b; font-weight: 500; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .editing-input { background: white !important; border: 1px solid #cbd5e1 !important; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); }
        .filter-btn-active { background-color: #0f172a; color: white; }
        .filter-btn-inactive { background-color: #e2e8f0; color: #64748b; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-l-8 border-indigo-800 pl-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-slate-900 flex flex-wrap items-center gap-3">
                    研究活動スケジュール管理
                    <span id="sync-status"></span>
                </h1>
                <p class="text-slate-500 mt-2 font-medium text-sm md:text-base">学会発表と論文投稿に向けたタスク・〆切を統合管理します。</p>
            </div>
            <div class="flex flex-col items-end gap-2">
                <div id="auth-container" class="bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 text-base flex items-center gap-3">
                    <span id="user-info" class="text-slate-600 font-bold">起動中...</span>
                    <button id="login-btn" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm font-bold hover:bg-indigo-700 transition shadow hidden">Googleでログイン</button>
                    <button id="logout-btn" class="bg-slate-100 text-slate-600 px-4 py-2 rounded text-sm font-bold hover:bg-slate-200 transition border border-slate-200 hidden">ログアウト</button>
                </div>
                <div id="overview-stats" class="text-right text-base text-slate-600 font-bold bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 hidden md:block">
                    </div>
            </div>
        </header>

        <div id="error-display" class="hidden mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm font-bold whitespace-pre-wrap"></div>

        <div class="bg-white border border-slate-200 p-4 md:p-6 rounded-2xl mb-8 shadow-sm">
            <h2 class="text-base font-bold text-slate-800 flex items-center gap-2 cursor-pointer select-none mb-4" onclick="toggleAddForm()">
                <span class="text-indigo-600 text-lg">➕</span> 新しい予定（学会・論文）を追加
                <span id="add-form-icon" class="text-slate-400 text-sm ml-auto">▼</span>
            </h2>
            <div id="add-project-form" class="hidden mt-4">
                <div class="flex gap-6 mb-6 p-3 bg-slate-50 rounded-lg border border-slate-200">
                    <label class="flex items-center gap-2 font-bold text-base cursor-pointer text-blue-800">
                        <input type="radio" name="projType" value="conference" checked onchange="toggleFormMode()" class="w-5 h-5 text-blue-600">
                        🎤 学会発表
                    </label>
                    <label class="flex items-center gap-2 font-bold text-base cursor-pointer text-rose-800">
                        <input type="radio" name="projType" value="paper" onchange="toggleFormMode()" class="w-5 h-5 text-rose-600">
                        📄 論文投稿
                    </label>
                </div>

                <div id="form-conference" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                    <div class="lg:col-span-1">
                        <label class="block text-sm font-bold text-slate-500 mb-1">学会・大会名 <span class="text-red-500">*</span></label>
                        <input type="text" id="simConfName" placeholder="例: 日本語教育学会 2026春季" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div class="lg:col-span-2">
                        <label class="block text-sm font-bold text-slate-500 mb-1">発表タイトル</label>
                        <input type="text" id="simConfTitle" placeholder="例: 〇〇に関する考察" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1">発表形式</label>
                        <select id="simConfFormat" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-blue-500">
                            <option value="">未定 / 選択なし</option>
                            <option value="口頭発表">口頭発表</option>
                            <option value="ポスター発表">ポスター発表</option>
                            <option value="パネルセッション">パネルセッション</option>
                            <option value="デモ">デモ</option>
                            <option value="交流ひろば">交流ひろば</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1">ステイタス</label>
                        <select id="simConfStatus" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-blue-500">
                            <option value="単独">単独</option>
                            <option value="共同（筆頭）">共同（筆頭）</option>
                            <option value="共同（筆頭でない）">共同（筆頭でない）</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1">査読の有無</label>
                        <select id="simConfPeerReview" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-blue-500">
                            <option value="査読有">査読有</option>
                            <option value="査読無" selected>査読無</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1">公式サイトURL</label>
                        <input type="url" id="simConfUrl" placeholder="https://..." class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1">開催地</label>
                        <input type="text" id="simConfLocation" placeholder="オンライン, 東京など" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div class="flex gap-2 lg:col-span-2">
                        <div class="w-1/2">
                            <label class="block text-sm font-bold text-slate-500 mb-1">開始日 <span class="text-red-500">*</span></label>
                            <input type="date" id="simConfStartDate" onchange="syncEndDate()" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div class="w-1/2">
                            <label class="block text-sm font-bold text-slate-500 mb-1">終了日</label>
                            <input type="date" id="simConfEndDate" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <div id="form-paper" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                    <div class="lg:col-span-1">
                        <label class="block text-sm font-bold text-slate-500 mb-1">投稿先（学会誌・紀要） <span class="text-red-500">*</span></label>
                        <input type="text" id="simPaperName" placeholder="例: 日本語教育学会誌" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500">
                    </div>
                    <div class="lg:col-span-2">
                        <label class="block text-sm font-bold text-slate-500 mb-1">論文タイトル</label>
                        <input type="text" id="simPaperTitle" placeholder="例: 〇〇に関する考察" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1">原稿種別</label>
                        <select id="simPaperFormat" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-rose-500">
                            <option value="論文">論文</option>
                            <option value="実践報告">実践報告</option>
                            <option value="研究ノート">研究ノート</option>
                            <option value="調査報告">調査報告</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1">ステイタス</label>
                        <select id="simPaperStatus" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-rose-500">
                            <option value="単著">単著</option>
                            <option value="共著（筆頭）">共著（筆頭）</option>
                            <option value="共著（筆頭でない）">共著（筆頭でない）</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1">査読の有無</label>
                        <select id="simPaperPeerReview" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-rose-500">
                            <option value="査読有">査読有</option>
                            <option value="査読無" selected>査読無</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1">投稿規定・ガイドラインURL</label>
                        <input type="url" id="simPaperUrl" placeholder="https://..." class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500">
                    </div>
                    <div class="lg:col-span-2">
                        <label class="block text-sm font-bold text-slate-500 mb-1">規定メモ（文字数・ページ数など）</label>
                        <input type="text" id="simPaperLocation" placeholder="例: 24,000字以内, 図表込み10ページ" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500">
                    </div>
                    <div class="lg:col-span-1">
                        <label class="block text-sm font-bold text-slate-500 mb-1">目標投稿日(〆切) <span class="text-red-500">*</span></label>
                        <input type="date" id="simPaperStartDate" class="w-full p-2.5 rounded border border-slate-300 text-base focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500">
                    </div>
                </div>

                <div class="flex justify-end mt-4">
                    <button onclick="importProject()" class="w-full md:w-auto bg-slate-900 text-white font-bold px-8 py-3 rounded shadow hover:bg-slate-800 transition whitespace-nowrap text-base">
                        スケジュール作成
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow border border-slate-200 overflow-hidden">
            <div class="flex border-b border-slate-200 bg-slate-50">
                <button onclick="switchTab('timeline')" id="tab-timeline" class="flex-1 py-4 text-center tab-active hover:bg-slate-100 transition text-base font-bold">
                    ⏱️ 全タスク 総合タイムライン
                </button>
                <button onclick="switchTab('project')" id="tab-project" class="flex-1 py-4 text-center tab-inactive hover:bg-slate-100 transition text-base font-bold">
                    📁 プロジェクト別に管理・編集
                </button>
            </div>

            <div id="content-area" class="p-4 md:p-6 bg-slate-50 min-h-[500px]">
                <div class="text-center py-20 text-slate-400 font-bold text-lg">データを読み込み中...</div>
            </div>
        </div>
        <div class="mt-4 text-center text-slate-400 text-xs md:text-sm">
            ※各タスクの ✏️ ボタンを押すと内容を編集できます。保存は ✅ ボタンを押してください。<br>
            ※右端にある 📅 ボタンでGoogleカレンダーに登録できます。<br>
            ※完了したタスクは翌日になると自動的に非表示になります。
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const myFirebaseConfig = {
            apiKey: "AIzaSyC7mMddmukCPXkPX7Z2MD5fTcCFmUXnKGw",
            authDomain: "gakkai-task-manager.firebaseapp.com",
            projectId: "gakkai-task-manager",
            storageBucket: "gakkai-task-manager.firebasestorage.app",
            messagingSenderId: "841054331141",
            appId: "1:841054331141:web:c9c72af9178b919414976c"
        };

        window.projects = [];
        window.currentTab = 'timeline';
        window.timelineFilter = 'all'; 
        
        const APP_ID = 'academic_manager_v1'; 
        const LOCAL_STORAGE_KEY = 'academic_projects_v1';

        const TASK_TEMPLATES_CONF = [
            { name: '入会手続き', offsetDays: -120 },
            { name: '年会費支払い', offsetDays: -120 },
            { name: '発表申し込み', offsetDays: -90 }, // 学会申し込み〆切（これを基準にする）
            { name: '発表要旨の作成', offsetDays: -60 },
            { name: '参加申し込み', offsetDays: -60 },
            { name: '交通手段予約', offsetDays: -60 },
            { name: '出張手続き', offsetDays: -30 },
            { name: '発表予稿の作成', offsetDays: -30 },
            { name: 'ポスター・スライドの作成', offsetDays: -21 }
        ];

        const TASK_TEMPLATES_PAPER = [
            { name: '構想・データ整理の完了', offsetDays: -90 },
            { name: '先行研究の収集・整理', offsetDays: -60 },
            { name: '本文執筆（分析・結果 / 実践内容）', offsetDays: -45 },
            { name: '本文執筆（考察・結論）', offsetDays: -30 },
            { name: '初稿完成・共同研究者へ確認依頼', offsetDays: -21 },
            { name: 'フィードバック反映', offsetDays: -14 },
            { name: '指定フォーマットへの流し込み', offsetDays: -10 },
            { name: '引用モレ・参考文献リストの書式確認', offsetDays: -5 },
            { name: '最終確認（文字数上限・図表番号等）', offsetDays: -2 },
            { name: '論文投稿完了（システム登録または郵送）', offsetDays: 0 } // 投稿〆切（これを基準にする）
        ];

        const REVIEW_TASKS = [
            { name: '査読コメント整理・対応方針の検討', offsetDays: 7 },
            { name: '追加のデータ分析・文献確認', offsetDays: 21 },
            { name: '修正第二稿の作成', offsetDays: 35 },
            { name: '修正箇所明記書の作成', offsetDays: 40 },
            { name: '修正原稿の再提出（Resubmission）', offsetDays: 45 }
        ];

        let app, auth, db, provider;
        let currentUser = null;

        function getJSTDateStr() {
            const d = new Date();
            d.setTime(d.getTime() + 9 * 60 * 60 * 1000);
            return d.toISOString().split('T')[0];
        }

        function isOldTask(completedAt) {
            if (!completedAt) return true; 
            return completedAt < getJSTDateStr();
        }

        window.getGoogleCalendarUrl = function(taskName, dateStr, projName, title) {
            if (!dateStr) return '#';
            const d = new Date(dateStr);
            const d2 = new Date(d); d2.setDate(d2.getDate() + 1);
            const formatDate = (dt) => `${dt.getFullYear()}${String(dt.getMonth() + 1).padStart(2, '0')}${String(dt.getDate()).padStart(2, '0')}`;
            const text = encodeURIComponent(`[${projName}] ${taskName}`);
            const details = encodeURIComponent(`研究活動タスク管理ツールより。\n${title ? 'タイトル: ' + title : ''}`);
            return `https://www.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${formatDate(d)}/${formatDate(d2)}&details=${details}`;
        }

        window.syncEndDate = function() {
            const startInput = document.getElementById('simConfStartDate');
            const endInput = document.getElementById('simConfEndDate');
            if (startInput.value) {
                if (!endInput.value || new Date(endInput.value) < new Date(startInput.value)) {
                    endInput.value = startInput.value;
                }
                endInput.min = startInput.value;
            }
        };

        window.syncEditEndDate = function(pid) {
            const startInput = document.getElementById(`editStartDate_${pid}`);
            const endInput = document.getElementById(`editEndDate_${pid}`);
            if (startInput && endInput && startInput.value) {
                if (!endInput.value || new Date(endInput.value) < new Date(startInput.value)) {
                    endInput.value = startInput.value;
                }
                endInput.min = startInput.value;
            }
        };

        try {
            app = initializeApp(myFirebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            provider = new GoogleAuthProvider();
            
            document.getElementById('login-btn').onclick = async () => { 
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    alert("ログイン機能がブロックされました。\n理由: " + error.message);
                }
            };
            
            document.getElementById('logout-btn').onclick = async () => { await signOut(auth); window.projects = []; window.render(); };

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    document.getElementById('user-info').innerHTML = `👤 <span class="font-bold text-indigo-700">${user.displayName || 'ユーザー'}</span> さん`;
                    document.getElementById('login-btn').classList.add('hidden');
                    document.getElementById('logout-btn').classList.remove('hidden');
                    setupFirestoreListener();
                } else {
                    document.getElementById('user-info').innerHTML = `同期機能は未ログインです`;
                    document.getElementById('login-btn').classList.remove('hidden');
                    document.getElementById('logout-btn').classList.add('hidden');
                    fallbackInit();
                }
            });
        } catch (e) { fallbackInit(); }

        const showError = (msg) => {
            const el = document.getElementById('error-display');
            if (el) { el.textContent = msg; el.classList.remove('hidden'); setTimeout(() => el.classList.add('hidden'), 10000); }
        };

        function fallbackInit() {
            const savedData = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (savedData) { try { window.projects = JSON.parse(savedData); } catch(e) { window.projects = []; } }
            window.render();
        }

        function setupFirestoreListener() {
            if (!currentUser) return;
            const projectsRef = collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'projects');
            onSnapshot(projectsRef, (snapshot) => {
                let synced = [];
                snapshot.forEach(doc => { synced.push({ id: doc.id, ...doc.data() }); });
                window.projects = synced;
                window.render();
            });
        }

        async function saveProject(proj) {
            try {
                if (currentUser) {
                    const docRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'projects', proj.id);
                    await setDoc(docRef, proj);
                } else {
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(window.projects));
                }
            } catch(e) { showError("保存エラー"); }
            window.render();
        }

        window.toggleAddForm = () => {
            const f = document.getElementById('add-project-form');
            const i = document.getElementById('add-form-icon');
            f.classList.toggle('hidden');
            i.textContent = f.classList.contains('hidden') ? '▼' : '▲';
        };

        window.toggleFormMode = () => {
            const type = document.querySelector('input[name="projType"]:checked').value;
            document.getElementById('form-conference').classList.toggle('hidden', type !== 'conference');
            document.getElementById('form-paper').classList.toggle('hidden', type !== 'paper');
        };

        window.importProject = async () => {
            const type = document.querySelector('input[name="projType"]:checked').value;
            let name, title, format, status, peerReview, url, location, startDate, endDate, templates;

            if (type === 'conference') {
                name = document.getElementById('simConfName').value;
                title = document.getElementById('simConfTitle').value;
                format = document.getElementById('simConfFormat').value;
                status = document.getElementById('simConfStatus').value;
                peerReview = document.getElementById('simConfPeerReview').value;
                url = document.getElementById('simConfUrl').value;
                location = document.getElementById('simConfLocation').value || '未設定';
                startDate = document.getElementById('simConfStartDate').value; // 学会の開催日
                endDate = document.getElementById('simConfEndDate').value || startDate;
                templates = TASK_TEMPLATES_CONF;
            } else {
                name = document.getElementById('simPaperName').value;
                title = document.getElementById('simPaperTitle').value;
                format = document.getElementById('simPaperFormat').value;
                status = document.getElementById('simPaperStatus').value;
                peerReview = document.getElementById('simPaperPeerReview').value;
                url = document.getElementById('simPaperUrl').value;
                location = document.getElementById('simPaperLocation').value || '指定なし';
                startDate = document.getElementById('simPaperStartDate').value; // 論文の投稿目標日
                endDate = startDate;
                templates = TASK_TEMPLATES_PAPER;
            }

            if (!name || !startDate) return alert('必須項目を入力してください。');

            const tasks = templates.map(t => {
                const d = new Date(startDate);
                d.setDate(d.getDate() + t.offsetDays);
                return { id: 't_' + Math.random().toString(36).substr(2, 9), name: t.name, dueDate: d.toISOString().split('T')[0], completed: false };
            });

            // ★ 修正: 査読有の場合は「査読結果通知」タスクを動的に追加
            if (peerReview === '査読有') {
                let reviewNoticeDate = new Date(startDate);
                if (type === 'conference') {
                    // 学会の場合: 「発表申し込み」の日付（開催日の90日前）を基準にする
                    reviewNoticeDate.setDate(reviewNoticeDate.getDate() - 90);
                }
                // 基準日の「2ヶ月後」に設定
                reviewNoticeDate.setMonth(reviewNoticeDate.getMonth() + 2);

                tasks.push({
                    id: 't_' + Math.random().toString(36).substr(2, 9),
                    name: '査読結果通知',
                    dueDate: reviewNoticeDate.toISOString().split('T')[0],
                    completed: false
                });
            }

            tasks.sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));

            const newProj = {
                id: 'p_' + Math.random().toString(36).substr(2, 9),
                projectType: type, name, presentationTitle: title, presentationFormat: format,
                presentationStatus: status,
                peerReview: peerReview,
                url, location, startDate, endDate, tasks, isExpanded: true
            };

            window.projects.push(newProj);
            window.render();
            await saveProject(newProj);
            window.toggleAddForm();
        };

        window.duplicateProject = async (pid) => {
            if(!confirm("この情報をコピーして新しい予定を作成しますか？")) return;
            const orig = window.projects.find(x => x.id === pid);
            if(orig){
                const newTasks = orig.tasks.map(t => ({
                    ...t,
                    id: 't_' + Math.random().toString(36).substr(2, 9),
                    completed: false,
                    completedAt: null
                }));

                const newProj = {
                    ...orig,
                    id: 'p_' + Math.random().toString(36).substr(2, 9),
                    presentationTitle: orig.presentationTitle ? orig.presentationTitle + "（コピー）" : "タイトル未定",
                    tasks: newTasks,
                    isExpanded: true,
                    isEditing: true
                };

                window.projects.push(newProj);
                window.render();
                await saveProject(newProj);
            }
        };

        window.toggleTask = async (pid, tid) => {
            const p = window.projects.find(x => x.id === pid);
            if(p){ const t = p.tasks.find(x => x.id === tid); if(t){ t.completed = !t.completed; t.completedAt = t.completed ? getJSTDateStr() : null; window.render(); await saveProject(p); } }
        };

        window.toggleTaskEdit = async (pid, tid, btn) => {
            const row = btn.closest('tr');
            const input = row.querySelector('.task-name-input');
            const isEditing = input.hasAttribute('readonly');

            if (isEditing) {
                input.removeAttribute('readonly');
                input.classList.add('editing-input');
                input.focus();
                btn.innerHTML = '✅';
            } else {
                const val = input.value.trim();
                const p = window.projects.find(x => x.id === pid);
                if(p){ 
                    const t = p.tasks.find(x => x.id === tid); 
                    if(t && t.name !== val){ 
                        t.name = val; 
                        await saveProject(p); 
                    } 
                }
                input.setAttribute('readonly', true);
                input.classList.remove('editing-input');
                btn.innerHTML = '✏️';
            }
        };

        window.updateDate = async (pid, tid, val) => {
            const p = window.projects.find(x => x.id === pid);
            if(p){ const t = p.tasks.find(x => x.id === tid); if(t){ t.dueDate = val; p.tasks.sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate)); window.render(); await saveProject(p); } }
        };

        window.deleteTask = async (pid, tid) => {
            const p = window.projects.find(x => x.id === pid);
            if(p){ p.tasks = p.tasks.filter(x => x.id !== tid); window.render(); await saveProject(p); }
        };

        window.addCustomTask = async (pid) => {
            const n = document.getElementById(`cName_${pid}`), d = document.getElementById(`cDate_${pid}`);
            if(!n.value || !d.value) return alert('入力してください');
            const p = window.projects.find(x => x.id === pid);
            if(p){ p.tasks.push({id:'t_'+Math.random().toString(36).substr(2,9), name:n.value, dueDate:d.value, completed:false});
                    p.tasks.sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate)); n.value=''; d.value=''; window.render(); await saveProject(p); }
        };

        window.toggleProjectExpand = async (pid) => { const p = window.projects.find(x => x.id === pid); if(p){ p.isExpanded = !p.isExpanded; window.render(); await saveProject(p); } };
        window.startEdit = (id) => { const p = window.projects.find(x => x.id === id); if(p){ p.isEditing = true; p.isExpanded = true; window.render(); }};
        window.cancelEdit = (id) => { const p = window.projects.find(x => x.id === id); if(p){ p.isEditing = false; window.render(); }};
        window.saveEdit = async (id) => {
            const p = window.projects.find(x => x.id === id);
            if(p){
                p.name = document.getElementById(`editName_${id}`).value;
                p.presentationTitle = document.getElementById(`editTitle_${id}`).value;
                p.presentationFormat = document.getElementById(`editFormat_${id}`).value;
                p.presentationStatus = document.getElementById(`editStatus_${id}`).value;
                p.peerReview = document.getElementById(`editPeerReview_${id}`).value;
                p.url = document.getElementById(`editUrl_${id}`).value;
                p.location = document.getElementById(`editLocation_${id}`).value;
                p.startDate = document.getElementById(`editStartDate_${id}`).value;
                const endEl = document.getElementById(`editEndDate_${id}`);
                p.endDate = endEl ? endEl.value || p.startDate : p.startDate;
                p.isEditing = false;
                window.render(); await saveProject(p);
            }
        };

        window.deleteProject = async (pid) => { if(confirm("削除しますか？")){ const pIdx = window.projects.findIndex(x=>x.id===pid); if(pIdx>=0){ if(currentUser){ await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'projects', pid)); } else { window.projects.splice(pIdx,1); localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(window.projects)); window.render(); } } } };

        window.addReviewTasks = async function(pid) {
            if(!confirm("査読対応タスクを追加しますか？")) return;
            const p = window.projects.find(x => x.id === pid);
            if(p){
                const now = new Date();
                REVIEW_TASKS.forEach(tpl => {
                    const d = new Date(now); d.setDate(d.getDate() + tpl.offsetDays);
                    p.tasks.push({ id: 't_' + Math.random().toString(36).substr(2, 9), name: tpl.name, dueDate: d.toISOString().split('T')[0], completed: false });
                });
                p.tasks.sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
                window.render(); await saveProject(p);
            }
        };

        window.switchTab = (id) => { window.currentTab = id; window.render(); };

        window.setTimelineFilter = (filter) => {
            window.timelineFilter = filter;
            window.render();
        };

        window.render = () => {
            const container = document.getElementById('content-area');
            const stats = document.getElementById('overview-stats');
            document.getElementById('tab-timeline').className = `flex-1 py-4 text-center ${window.currentTab === 'timeline' ? 'tab-active' : 'tab-inactive'} hover:bg-slate-100 transition text-base font-bold`;
            document.getElementById('tab-project').className = `flex-1 py-4 text-center ${window.currentTab === 'project' ? 'tab-active' : 'tab-inactive'} hover:bg-slate-100 transition text-base font-bold`;

            if (window.projects.length === 0) {
                stats.classList.add('hidden');
                container.innerHTML = `<div class="text-center py-20 text-slate-400 font-bold text-lg">予定がありません</div>`;
                return;
            }
            stats.classList.remove('hidden');
            let t=0, d=0; window.projects.forEach(p => { t+=p.tasks.length; d+=p.tasks.filter(x=>x.completed).length; });
            stats.innerHTML = `進行中: <span class="text-indigo-600">${window.projects.length}</span> 件 | 達成率: <span class="text-indigo-600">${Math.round((d/t)*100)||0}%</span>`;
            
            if (window.currentTab === 'project') window.renderProjectView(container);
            else window.renderTimelineView(container);
        };

        window.renderProjectView = (container) => {
            const sorted = [...window.projects].sort((a,b) => new Date(a.startDate) - new Date(b.startDate));
            let html = '<div class="space-y-4">';
            sorted.forEach(proj => {
                const done = proj.tasks.filter(x=>x.completed).length;
                const prog = Math.round((done/proj.tasks.length)*100)||0;
                const visibleTasks = proj.tasks.filter(t => !(t.completed && isOldTask(t.completedAt)));
                const color = proj.projectType === 'paper' ? 'rose' : 'blue';
                
                const statusOptions = proj.projectType === 'paper' 
                    ? `<option value="単著" ${proj.presentationStatus==='単著'?'selected':''}>単著</option>
                       <option value="共著（筆頭）" ${proj.presentationStatus==='共著（筆頭）'?'selected':''}>共著（筆頭）</option>
                       <option value="共著（筆頭でない）" ${proj.presentationStatus==='共著（筆頭でない）'?'selected':''}>共著（筆頭でない）</option>`
                    : `<option value="単独" ${proj.presentationStatus==='単独'?'selected':''}>単独</option>
                       <option value="共同（筆頭）" ${proj.presentationStatus==='共同（筆頭）'?'selected':''}>共同（筆頭）</option>
                       <option value="共同（筆頭でない）" ${proj.presentationStatus==='共同（筆頭でない）'?'selected':''}>共同（筆頭でない）</option>`;

                const formatOptions = proj.projectType === 'paper'
                    ? `<option value="">未定 / 選択なし</option>
                       <option value="論文" ${proj.presentationFormat==='論文'?'selected':''}>論文</option>
                       <option value="実践報告" ${proj.presentationFormat==='実践報告'?'selected':''}>実践報告</option>
                       <option value="研究ノート" ${proj.presentationFormat==='研究ノート'?'selected':''}>研究ノート</option>
                       <option value="調査報告" ${proj.presentationFormat==='調査報告'?'selected':''}>調査報告</option>
                       <option value="その他" ${proj.presentationFormat==='その他'?'selected':''}>その他</option>`
                    : `<option value="">未定 / 選択なし</option>
                       <option value="口頭発表" ${proj.presentationFormat==='口頭発表'?'selected':''}>口頭発表</option>
                       <option value="ポスター発表" ${proj.presentationFormat==='ポスター発表'?'selected':''}>ポスター発表</option>
                       <option value="パネルセッション" ${proj.presentationFormat==='パネルセッション'?'selected':''}>パネルセッション</option>
                       <option value="デモ" ${proj.presentationFormat==='デモ'?'selected':''}>デモ</option>
                       <option value="交流ひろば" ${proj.presentationFormat==='交流ひろば'?'selected':''}>交流ひろば</option>
                       <option value="その他" ${proj.presentationFormat==='その他'?'selected':''}>その他</option>`;

                const peerReviewOptions = `
                    <option value="査読有" ${proj.peerReview === '査読有' ? 'selected' : ''}>査読有</option>
                    <option value="査読無" ${proj.peerReview !== '査読有' ? 'selected' : ''}>査読無</option>
                `;

                html += `
                <div class="bg-white border border-${color}-300 rounded-xl shadow-sm overflow-hidden">
                    ${proj.isEditing ? `
                    <div class="p-4 bg-slate-50 border-b border-slate-200 text-sm">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                            <div>名称: <input type="text" id="editName_${proj.id}" value="${proj.name}" class="w-full p-2 border rounded text-base"></div>
                            <div class="md:col-span-2">タイトル: <input type="text" id="editTitle_${proj.id}" value="${proj.presentationTitle}" class="w-full p-2 border rounded text-base"></div>
                            <div>発表形式: <select id="editFormat_${proj.id}" class="w-full p-2 border rounded text-base">${formatOptions}</select></div>
                            <div>ステイタス: <select id="editStatus_${proj.id}" class="w-full p-2 border rounded text-base">${statusOptions}</select></div>
                            <div>査読有無: <select id="editPeerReview_${proj.id}" class="w-full p-2 border rounded text-base">${peerReviewOptions}</select></div>
                            <div>URL: <input type="text" id="editUrl_${proj.id}" value="${proj.url}" class="w-full p-2 border rounded text-base"></div>
                            <div>メモ/地: <input type="text" id="editLocation_${proj.id}" value="${proj.location}" class="w-full p-2 border rounded text-base"></div>
                            <div class="flex gap-2">
                                <div class="w-1/2">開始日: <input type="date" id="editStartDate_${proj.id}" value="${proj.startDate}" onchange="syncEditEndDate('${proj.id}')" class="w-full p-2 border rounded text-base"></div>
                                <div class="w-1/2">終了日: <input type="date" id="editEndDate_${proj.id}" value="${proj.endDate || proj.startDate}" class="w-full p-2 border rounded text-base"></div>
                            </div>
                        </div>
                        <div class="flex justify-end gap-2"><button onclick="cancelEdit('${proj.id}')" class="px-4 py-2 bg-white border rounded text-sm font-bold">戻る</button><button onclick="saveEdit('${proj.id}')" class="px-4 py-2 bg-indigo-600 text-white rounded text-sm font-bold">保存</button></div>
                    </div>` : `
                    <div class="p-4 flex flex-col sm:flex-row justify-between items-center cursor-pointer hover:bg-slate-50" onclick="toggleProjectExpand('${proj.id}')">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">${proj.isExpanded?'🔽':'▶️'}</span>
                            <div>
                                <h3 class="text-lg font-black flex items-center flex-wrap gap-2">
                                    <span>${proj.projectType==='paper'?'📄':'🎤'} ${proj.name}</span>
                                    ${proj.peerReview === '査読有' ? `<span class="text-xl" title="査読有">🔍</span>` : ''}
                                    ${proj.url ? `<a href="${proj.url}" target="_blank" onclick="event.stopPropagation();" class="text-indigo-500 hover:text-indigo-700 text-xl">🌐</a>` : ''}
                                    <span class="px-2 py-0.5 rounded border text-xs bg-${color}-50 text-${color}-700 border-${color}-200">${proj.presentationFormat}</span>
                                    ${proj.presentationStatus ? `<span class="px-2 py-0.5 rounded border text-xs bg-slate-100 text-slate-700 border-slate-300">${proj.presentationStatus}</span>` : ''}
                                </h3>
                                <div class="text-sm text-slate-500 mt-1">${proj.startDate} ${proj.endDate && proj.endDate !== proj.startDate ? '〜 ' + proj.endDate : ''} | ${proj.presentationTitle || '未定'}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 mt-3 sm:mt-0">
                            ${proj.projectType==='paper'?`<button onclick="event.stopPropagation();addReviewTasks('${proj.id}')" class="text-xs bg-rose-100 text-rose-800 px-3 py-1.5 rounded font-bold">査読対応</button>`:''}
                            <span class="text-sm font-bold">${prog}%</span>
                            <button onclick="event.stopPropagation();duplicateProject('${proj.id}')" class="text-xl opacity-70 hover:opacity-100 transition" title="この情報を複製する">📋</button>
                            <button onclick="event.stopPropagation();startEdit('${proj.id}')" class="text-xl">✏️</button>
                            <button onclick="event.stopPropagation();deleteProject('${proj.id}')" class="text-xl">🗑️</button>
                        </div>
                    </div>`}
                    <div class="${proj.isExpanded && !proj.isEditing?'block':'hidden'} border-t border-slate-100">
                        <table class="w-full text-base">
                            <thead class="bg-slate-100 text-xs uppercase text-slate-500 border-b border-slate-200">
                                <tr>
                                    <th class="p-2 w-12"></th>
                                    <th class="p-2 w-36 text-left">期日</th>
                                    <th class="p-2 text-left">タスク内容</th>
                                    <th class="p-2 w-28 text-center"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-300">
                                ${visibleTasks.map(t => {
                                    const isPast = !t.completed && new Date(t.dueDate) < new Date(new Date().setHours(0,0,0,0));
                                    const rowColor = proj.projectType==='paper'?(t.completed?'bg-rose-50/40':'bg-rose-50/20'):(t.completed?'bg-blue-50/40':'bg-blue-50/20');
                                    return `<tr class="${rowColor} ${t.completed?'opacity-50':''}">
                                        <td class="p-3 text-center"><input type="checkbox" ${t.completed?'checked':''} onchange="toggleTask('${proj.id}','${t.id}')" class="w-4 h-4"></td>
                                        <td class="p-3">
                                            <input type="date" value="${t.dueDate}" onchange="updateDate('${proj.id}','${t.id}',this.value)" class="text-sm bg-transparent border-none ${isPast?'text-red-600 font-bold':''}">
                                        </td>
                                        <td class="p-3">
                                            <input type="text" value="${t.name}" readonly class="task-name-input w-full bg-transparent px-1 rounded outline-none transition text-base ${t.completed?'line-through text-slate-400':''}">
                                        </td>
                                        <td class="p-3 text-center space-x-3">
                                            <button onclick="toggleTaskEdit('${proj.id}','${t.id}',this)" class="edit-task-btn text-sm">✏️</button>
                                            <a href="${window.getGoogleCalendarUrl(t.name, t.dueDate, proj.name, proj.presentationTitle)}" target="_blank" class="text-lg">📅</a>
                                            <button onclick="deleteTask('${proj.id}','${t.id}')" class="text-sm">🗑️</button>
                                        </td>
                                    </tr>`}).join('')}
                            </tbody>
                        </table>
                        <div class="p-3 bg-slate-50 flex gap-2 border-t border-slate-300">
                            <input type="text" id="cName_${proj.id}" placeholder="新規タスクを追加..." class="flex-1 text-sm border rounded px-3 py-1.5">
                            <input type="date" id="cDate_${proj.id}" class="text-sm border rounded px-2 py-1.5">
                            <button onclick="addCustomTask('${proj.id}')" class="text-sm bg-slate-700 text-white px-4 rounded font-bold">＋</button>
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = html + '</div>';
        };

        window.renderTimelineView = (container) => {
            let all = []; 
            const now = new Date();
            const oneMonthLater = new Date(); oneMonthLater.setMonth(now.getMonth() + 1);
            const twoMonthsLater = new Date(); twoMonthsLater.setMonth(now.getMonth() + 2);

            window.projects.forEach(p => p.tasks.forEach(t => { 
                if (!(t.completed && isOldTask(t.completedAt))) {
                    const dueDate = new Date(t.dueDate);
                    let include = true;
                    if (window.timelineFilter === '1month' && dueDate > oneMonthLater) include = false;
                    if (window.timelineFilter === '2months' && dueDate > twoMonthsLater) include = false;
                    
                    if (include) {
                        all.push({...t, pId:p.id, pName:p.name, pType:p.projectType, pTitle:p.presentationTitle, pUrl:p.url, pStatus:p.presentationStatus, pPeerReview:p.peerReview});
                    }
                }
            }));
            all.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));

            const filterUI = `
                <div class="flex gap-3 mb-4">
                    <button onclick="setTimelineFilter('all')" class="px-4 py-2 rounded-full text-sm font-bold transition ${window.timelineFilter === 'all' ? 'filter-btn-active' : 'filter-btn-inactive'}">すべて</button>
                    <button onclick="setTimelineFilter('1month')" class="px-4 py-2 rounded-full text-sm font-bold transition ${window.timelineFilter === '1month' ? 'filter-btn-active' : 'filter-btn-inactive'}">1ヶ月以内</button>
                    <button onclick="setTimelineFilter('2months')" class="px-4 py-2 rounded-full text-sm font-bold transition ${window.timelineFilter === '2months' ? 'filter-btn-active' : 'filter-btn-inactive'}">2ヶ月以内</button>
                </div>
            `;

            container.innerHTML = filterUI + `<div class="bg-white border rounded-xl overflow-hidden shadow-sm">
                <table class="w-full text-base">
                    <thead class="bg-slate-900 text-white text-xs text-left uppercase">
                        <tr>
                            <th class="p-3 w-12"></th>
                            <th class="p-3 w-36">期日 ▲</th>
                            <th class="p-3">内容</th>
                            <th class="p-3 w-28 text-center"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-300">
                        ${all.length === 0 ? '<tr><td colspan="4" class="p-10 text-center text-slate-400 font-bold text-base">該当するタスクはありません</td></tr>' : 
                        all.map(t => {
                            const isPast = !t.completed && new Date(t.dueDate) < new Date(new Date().setHours(0,0,0,0));
                            const rowColor = t.pType==='paper'?(t.completed?'bg-rose-50/40':'bg-rose-50/30'):(t.completed?'bg-blue-50/40':'bg-blue-50/30');
                            return `<tr class="${rowColor} ${t.completed?'opacity-50':''}">
                                <td class="p-3 text-center"><input type="checkbox" ${t.completed?'checked':''} onchange="toggleTask('${t.pId}','${t.id}')" class="w-4 h-4"></td>
                                <td class="p-3"><input type="date" value="${t.dueDate}" onchange="updateDate('${t.pId}','${t.id}',this.value)" class="text-sm bg-transparent border-none ${isPast?'text-red-600 font-bold':''}"></td>
                                <td class="p-3">
                                    <div class="text-xs font-bold opacity-70 flex items-center flex-wrap gap-2 mb-1">
                                        <span>${t.pType==='paper'?'📄':'🎤'} ${t.pName}</span>
                                        ${t.pPeerReview === '査読有' ? `<span class="text-sm" title="査読有">🔍</span>` : ''}
                                        ${t.pUrl ? `<a href="${t.pUrl}" target="_blank" class="text-indigo-500 text-sm">🌐</a>` : ''}
                                        ${t.pStatus ? `<span class="px-1.5 py-0.5 rounded border bg-slate-100 text-slate-600 border-slate-200">${t.pStatus}</span>` : ''}
                                    </div>
                                    <input type="text" value="${t.name}" readonly class="task-name-input w-full bg-transparent px-1 rounded outline-none transition text-base ${t.completed?'line-through text-slate-400':'font-medium'}">
                                </td>
                                <td class="p-3 text-center space-x-3">
                                    <button onclick="toggleTaskEdit('${t.pId}','${t.id}',this)" class="edit-task-btn text-sm">✏️</button>
                                    <a href="${window.getGoogleCalendarUrl(t.name, t.dueDate, t.pName, t.pTitle)}" target="_blank" class="text-lg">📅</a>
                                    <button onclick="deleteTask('${t.pId}','${t.id}')" class="text-sm">🗑️</button>
                                </td>
                            </tr>`}).join('')}
                    </tbody>
                </table>
            </div>`;
        };
    </script>
</body>
</html>
