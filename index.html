<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研究活動（学会・論文）統合タスク管理ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f8fafc; }
        .tab-active { border-bottom: 4px solid #0f172a; color: #0f172a; font-weight: 900; }
        .tab-inactive { border-bottom: 4px solid transparent; color: #64748b; font-weight: 500; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-l-8 border-indigo-800 pl-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-slate-900 flex flex-wrap items-center gap-3">
                    研究活動スケジュール管理
                    <span id="sync-status"></span>
                </h1>
                <p class="text-slate-500 mt-2 font-medium">学会発表と論文投稿に向けたタスク・〆切を統合管理します。</p>
            </div>
            <div class="flex flex-col items-end gap-2">
                <div id="auth-container" class="bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 text-sm flex items-center gap-3">
                    <span id="user-info" class="text-slate-600 font-bold">起動中...</span>
                    <button id="login-btn" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-indigo-700 transition shadow hidden">Googleでログイン</button>
                    <button id="logout-btn" class="bg-slate-100 text-slate-600 px-3 py-1.5 rounded text-xs font-bold hover:bg-slate-200 transition border border-slate-200 hidden">ログアウト</button>
                </div>
                <div id="overview-stats" class="text-right text-sm text-slate-600 font-bold bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 hidden md:block">
                    </div>
            </div>
        </header>

        <div id="error-display" class="hidden mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs font-bold whitespace-pre-wrap"></div>

        <div class="bg-white border border-slate-200 p-4 md:p-6 rounded-2xl mb-8 shadow-sm">
            <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2 cursor-pointer select-none mb-4" onclick="toggleAddForm()">
                <span class="text-indigo-600">➕</span> 新しい予定（学会・論文）を追加
                <span id="add-form-icon" class="text-slate-400 text-xs ml-auto">▼</span>
            </h2>
            <div id="add-project-form" class="hidden mt-4">
                
                <div class="flex gap-6 mb-6 p-3 bg-slate-50 rounded-lg border border-slate-200">
                    <label class="flex items-center gap-2 font-bold text-sm cursor-pointer text-blue-800">
                        <input type="radio" name="projType" value="conference" checked onchange="toggleFormMode()" class="w-4 h-4 text-blue-600">
                        🎓 学会発表
                    </label>
                    <label class="flex items-center gap-2 font-bold text-sm cursor-pointer text-rose-800">
                        <input type="radio" name="projType" value="paper" onchange="toggleFormMode()" class="w-4 h-4 text-rose-600">
                        📄 論文投稿
                    </label>
                </div>

                <div id="form-conference" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                    <div class="lg:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 mb-1">学会・大会名 <span class="text-red-500">*</span></label>
                        <input type="text" id="simConfName" placeholder="例: 日本語教育学会 2026春季" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div class="lg:col-span-2">
                        <label class="block text-xs font-bold text-slate-500 mb-1">発表タイトル</label>
                        <input type="text" id="simConfTitle" placeholder="例: 〇〇に関する考察" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">発表形式</label>
                        <select id="simConfFormat" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-blue-500">
                            <option value="">未定 / 選択なし</option>
                            <option value="口頭">口頭発表</option>
                            <option value="ポスター">ポスター発表</option>
                            <option value="パネル">パネルセッション</option>
                            <option value="デモ">デモンストレーション</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">公式サイトURL</label>
                        <input type="url" id="simConfUrl" placeholder="https://..." class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">開催地</label>
                        <input type="text" id="simConfLocation" placeholder="オンライン, 東京など" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div class="flex gap-2 lg:col-span-2">
                        <div class="w-1/2">
                            <label class="block text-xs font-bold text-slate-500 mb-1">開始日 <span class="text-red-500">*</span></label>
                            <input type="date" id="simConfStartDate" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div class="w-1/2">
                            <label class="block text-xs font-bold text-slate-500 mb-1">終了日</label>
                            <input type="date" id="simConfEndDate" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <div id="form-paper" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                    <div class="lg:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 mb-1">投稿先（学会誌・紀要） <span class="text-red-500">*</span></label>
                        <input type="text" id="simPaperName" placeholder="例: 日本語教育学会誌" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500">
                    </div>
                    <div class="lg:col-span-2">
                        <label class="block text-xs font-bold text-slate-500 mb-1">論文タイトル</label>
                        <input type="text" id="simPaperTitle" placeholder="例: 〇〇に関する考察" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">原稿種別</label>
                        <select id="simPaperFormat" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-rose-500">
                            <option value="論文">論文</option>
                            <option value="実践報告">実践報告</option>
                            <option value="研究ノート">研究ノート</option>
                            <option value="調査報告">調査報告</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div class="lg:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 mb-1">投稿規定・ガイドラインURL</label>
                        <input type="url" id="simPaperUrl" placeholder="https://..." class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500">
                    </div>
                    <div class="lg:col-span-2">
                        <label class="block text-xs font-bold text-slate-500 mb-1">規定メモ（文字数・ページ数など）</label>
                        <input type="text" id="simPaperLocation" placeholder="例: 24,000字以内, 図表込み10ページ" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500">
                    </div>
                    <div class="lg:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 mb-1">目標投稿日(〆切) <span class="text-red-500">*</span></label>
                        <input type="date" id="simPaperStartDate" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500">
                    </div>
                </div>

                <div class="flex justify-end mt-4">
                    <button onclick="importProject()" class="w-full md:w-auto bg-slate-900 text-white font-bold px-8 py-2.5 rounded shadow hover:bg-slate-800 transition whitespace-nowrap">
                        スケジュール作成
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow border border-slate-200 overflow-hidden">
            <div class="flex border-b border-slate-200 bg-slate-50">
                <button onclick="switchTab('timeline')" id="tab-timeline" class="flex-1 py-4 text-center tab-active hover:bg-slate-100 transition text-sm">
                    ⏱️ 全タスク 総合タイムライン
                </button>
                <button onclick="switchTab('project')" id="tab-project" class="flex-1 py-4 text-center tab-inactive hover:bg-slate-100 transition text-sm">
                    📁 プロジェクト別に管理・編集
                </button>
            </div>

            <div id="content-area" class="p-6 bg-slate-50 min-h-[500px]">
                <div class="text-center py-20 text-slate-400 font-bold">データを読み込み中...</div>
            </div>
        </div>
        <div class="mt-4 text-center text-slate-400 text-[10px]">
            ※タスク名の部分をクリックすると内容を直接編集できます。<br>
            ※右端にある 📅 ボタンでGoogleカレンダーに登録できます。<br>
            ※完了したタスクは翌日になると自動的に非表示になります。
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        // signInWithPopup に戻しています
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const myFirebaseConfig = {
            apiKey: "AIzaSyC7mMddmukCPXkPX7Z2MD5fTcCFmUXnKGw",
            authDomain: "gakkai-task-manager.firebaseapp.com",
            projectId: "gakkai-task-manager",
            storageBucket: "gakkai-task-manager.firebasestorage.app",
            messagingSenderId: "841054331141",
            appId: "1:841054331141:web:c9c72af9178b919414976c"
        };

        window.projects = [];
        window.currentTab = 'timeline';
        const APP_ID = 'academic_manager_v1'; 
        const LOCAL_STORAGE_KEY = 'academic_projects_v1';

        const TASK_TEMPLATES_CONF = [
            { name: '入会手続き', offsetDays: -120 },
            { name: '年会費支払い', offsetDays: -120 },
            { name: '発表申し込み', offsetDays: -90 },
            { name: '発表要旨の作成', offsetDays: -60 },
            { name: '参加申し込み', offsetDays: -60 },
            { name: '交通手段予約', offsetDays: -60 },
            { name: '出張手続き', offsetDays: -30 },
            { name: '発表予稿の作成', offsetDays: -30 },
            { name: 'ポスター・スライドの作成', offsetDays: -21 }
        ];

        const TASK_TEMPLATES_PAPER = [
            { name: '構想・データ整理の完了', offsetDays: -90 },
            { name: '先行研究の収集・整理', offsetDays: -60 },
            { name: '本文執筆（分析・結果 / 実践内容）', offsetDays: -45 },
            { name: '本文執筆（考察・結論）', offsetDays: -30 },
            { name: '初稿完成・共同研究者へ確認依頼', offsetDays: -21 },
            { name: 'フィードバック反映', offsetDays: -14 },
            { name: '指定フォーマットへの流し込み', offsetDays: -10 },
            { name: '引用モレ・参考文献リストの書式確認', offsetDays: -5 },
            { name: '最終確認（文字数上限・図表番号等）', offsetDays: -2 },
            { name: '論文投稿完了（システム登録または郵送）', offsetDays: 0 }
        ];

        const REVIEW_TASKS = [
            { name: '査読コメント整理・対応方針の検討', offsetDays: 7 },
            { name: '追加のデータ分析・文献確認', offsetDays: 21 },
            { name: '修正稿の作成（変更箇所の明記）', offsetDays: 35 },
            { name: '査読者への回答書（レスポンスレター）の作成', offsetDays: 40 },
            { name: '修正原稿の再提出（Resubmission）', offsetDays: 45 }
        ];

        let app, auth, db, provider;
        let currentUser = null;

        function getJSTDateStr() {
            const d = new Date();
            d.setTime(d.getTime() + 9 * 60 * 60 * 1000);
            return d.toISOString().split('T')[0];
        }

        function isOldTask(completedAt) {
            if (!completedAt) return true; 
            return completedAt < getJSTDateStr();
        }

        window.getGoogleCalendarUrl = function(taskName, dateStr, projName, title) {
            if (!dateStr) return '#';
            const d = new Date(dateStr);
            const d2 = new Date(d); d2.setDate(d2.getDate() + 1);
            const formatDate = (dt) => `${dt.getFullYear()}${String(dt.getMonth() + 1).padStart(2, '0')}${String(dt.getDate()).padStart(2, '0')}`;
            const text = encodeURIComponent(`[${projName}] ${taskName}`);
            const details = encodeURIComponent(`研究活動タスク管理ツールより。\n${title ? 'タイトル: ' + title : ''}`);
            return `https://www.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${formatDate(d)}/${formatDate(d2)}&details=${details}`;
        }

        try {
            app = initializeApp(myFirebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            provider = new GoogleAuthProvider();
            
            // ★ 万が一弾かれた場合はアラートを出すように変更 ★
            document.getElementById('login-btn').onclick = async () => { 
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    alert("ログイン機能がブロックされました。\n理由: " + error.message);
                }
            };
            
            document.getElementById('logout-btn').onclick = async () => { await signOut(auth); window.projects = []; window.render(); };

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    document.getElementById('user-info').innerHTML = `👤 <span class="font-bold text-indigo-700">${user.displayName || 'ユーザー'}</span> さん`;
                    document.getElementById('login-btn').classList.add('hidden');
                    document.getElementById('logout-btn').classList.remove('hidden');
                    setupFirestoreListener();
                } else {
                    document.getElementById('user-info').innerHTML = `同期機能は未ログインです`;
                    document.getElementById('login-btn').classList.remove('hidden');
                    document.getElementById('logout-btn').classList.add('hidden');
                    fallbackInit();
                }
            });
        } catch (e) { fallbackInit(); }

        const showError = (msg) => {
            const el = document.getElementById('error-display');
            if (el) { el.textContent = msg; el.classList.remove('hidden'); setTimeout(() => el.classList.add('hidden'), 10000); }
        };

        function fallbackInit() {
            const savedData = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (savedData) { try { window.projects = JSON.parse(savedData); } catch(e) { window.projects = []; } }
            window.render();
        }

        function setupFirestoreListener() {
            if (!currentUser) return;
            const projectsRef = collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'projects');
            onSnapshot(projectsRef, (snapshot) => {
                let synced = [];
                snapshot.forEach(doc => { synced.push({ id: doc.id, ...doc.data() }); });
                window.projects = synced;
                window.render();
            });
        }

        async function saveProject(proj) {
            try {
                if (currentUser) {
                    const docRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'projects', proj.id);
                    await setDoc(docRef, proj);
                } else {
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(window.projects));
                }
            } catch(e) { showError("保存エラー"); }
            window.render();
        }

        window.toggleAddForm = () => {
            const f = document.getElementById('add-project-form');
            const i = document.getElementById('add-form-icon');
            f.classList.toggle('hidden');
            i.textContent = f.classList.contains('hidden') ? '▼' : '▲';
        };

        window.toggleFormMode = () => {
            const type = document.querySelector('input[name="projType"]:checked').value;
            document.getElementById('form-conference').classList.toggle('hidden', type !== 'conference');
            document.getElementById('form-paper').classList.toggle('hidden', type !== 'paper');
        };

        window.importProject = async () => {
            const type = document.querySelector('input[name="projType"]:checked').value;
            let name, title, format, url, location, startDate, endDate, templates;

            if (type === 'conference') {
                name = document.getElementById('simConfName').value;
                title = document.getElementById('simConfTitle').value;
                format = document.getElementById('simConfFormat').value;
                url = document.getElementById('simConfUrl').value;
                location = document.getElementById('simConfLocation').value || '未設定';
                startDate = document.getElementById('simConfStartDate').value;
                endDate = document.getElementById('simConfEndDate').value || startDate;
                templates = TASK_TEMPLATES_CONF;
            } else {
                name = document.getElementById('simPaperName').value;
                title = document.getElementById('simPaperTitle').value;
                format = document.getElementById('simPaperFormat').value;
                url = document.getElementById('simPaperUrl').value;
                location = document.getElementById('simPaperLocation').value || '指定なし';
                startDate = document.getElementById('simPaperStartDate').value;
                endDate = startDate;
                templates = TASK_TEMPLATES_PAPER;
            }

            if (!name || !startDate) return alert('必須項目を入力してください。');

            const tasks = templates.map(t => {
                const d = new Date(startDate);
                d.setDate(d.getDate() + t.offsetDays);
                return { id: 't_' + Math.random().toString(36).substr(2, 9), name: t.name, dueDate: d.toISOString().split('T')[0], completed: false };
            });

            const newProj = {
                id: 'p_' + Math.random().toString(36).substr(2, 9),
                projectType: type, name, presentationTitle: title, presentationFormat: format,
                url, location, startDate, endDate, tasks, isExpanded: true
            };

            window.projects.push(newProj);
            window.render();
            await saveProject(newProj);
            window.toggleAddForm();
        };

        window.toggleTask = async (pid, tid) => {
            const p = window.projects.find(x => x.id === pid);
            if(p){ const t = p.tasks.find(x => x.id === tid); if(t){ t.completed = !t.completed; t.completedAt = t.completed ? getJSTDateStr() : null; window.render(); await saveProject(p); } }
        };

        window.updateTaskName = async (pid, tid, val) => {
            const p = window.projects.find(x => x.id === pid);
            if(p){ const t = p.tasks.find(x => x.id === tid); if(t && t.name !== val.trim()){ t.name = val.trim(); await saveProject(p); } }
        };

        window.updateDate = async (pid, tid, val) => {
            const p = window.projects.find(x => x.id === pid);
            if(p){ const t = p.tasks.find(x => x.id === tid); if(t){ t.dueDate = val; p.tasks.sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate)); window.render(); await saveProject(p); } }
        };

        window.deleteTask = async (pid, tid) => {
            const p = window.projects.find(x => x.id === pid);
            if(p){ p.tasks = p.tasks.filter(x => x.id !== tid); window.render(); await saveProject(p); }
        };

        window.addCustomTask = async (pid) => {
            const n = document.getElementById(`cName_${pid}`), d = document.getElementById(`cDate_${pid}`);
            if(!n.value || !d.value) return alert('入力してください');
            const p = window.projects.find(x => x.id === pid);
            if(p){ p.tasks.push({id:'t_'+Math.random().toString(36).substr(2,9), name:n.value, dueDate:d.value, completed:false});
                   p.tasks.sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate)); n.value=''; d.value=''; window.render(); await saveProject(p); }
        };

        window.toggleProjectExpand = async (pid) => { const p = window.projects.find(x => x.id === pid); if(p){ p.isExpanded = !p.isExpanded; window.render(); await saveProject(p); } };
        window.startEdit = (id) => { const p = window.projects.find(x => x.id === id); if(p){ p.isEditing = true; p.isExpanded = true; window.render(); }};
        window.cancelEdit = (id) => { const p = window.projects.find(x => x.id === id); if(p){ p.isEditing = false; window.render(); }};
        window.saveEdit = async (id) => {
            const p = window.projects.find(x => x.id === id);
            if(p){
                p.name = document.getElementById(`editName_${id}`).value;
                p.presentationTitle = document.getElementById(`editTitle_${id}`).value;
                p.presentationFormat = document.getElementById(`editFormat_${id}`).value;
                p.url = document.getElementById(`editUrl_${id}`).value;
                p.location = document.getElementById(`editLocation_${id}`).value;
                p.startDate = document.getElementById(`editStartDate_${id}`).value;
                const endEl = document.getElementById(`editEndDate_${id}`);
                p.endDate = endEl ? endEl.value || p.startDate : p.startDate;
                p.isEditing = false;
                window.render(); await saveProject(p);
            }
        };

        window.deleteProject = async (pid) => { if(confirm("削除しますか？")){ const pIdx = window.projects.findIndex(x=>x.id===pid); if(pIdx>=0){ if(currentUser){ await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'projects', pid)); } else { window.projects.splice(pIdx,1); localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(window.projects)); window.render(); } } } };

        window.addReviewTasks = async function(pid) {
            if(!confirm("査読対応タスクを追加しますか？")) return;
            const p = window.projects.find(x => x.id === pid);
            if(p){
                const now = new Date();
                REVIEW_TASKS.forEach(tpl => {
                    const d = new Date(now); d.setDate(d.getDate() + tpl.offsetDays);
                    p.tasks.push({ id: 't_' + Math.random().toString(36).substr(2, 9), name: tpl.name, dueDate: d.toISOString().split('T')[0], completed: false });
                });
                p.tasks.sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
                window.render(); await saveProject(p);
            }
        };

        window.switchTab = (id) => { window.currentTab = id; window.render(); };

        window.render = () => {
            const container = document.getElementById('content-area');
            const stats = document.getElementById('overview-stats');
            document.getElementById('tab-timeline').className = `flex-1 py-4 text-center ${window.currentTab === 'timeline' ? 'tab-active' : 'tab-inactive'} hover:bg-slate-100 transition text-sm`;
            document.getElementById('tab-project').className = `flex-1 py-4 text-center ${window.currentTab === 'project' ? 'tab-active' : 'tab-inactive'} hover:bg-slate-100 transition text-sm`;

            if (window.projects.length === 0) {
                stats.classList.add('hidden');
                container.innerHTML = `<div class="text-center py-20 text-slate-400 font-bold">予定がありません</div>`;
                return;
            }
            stats.classList.remove('hidden');
            let t=0, d=0; window.projects.forEach(p => { t+=p.tasks.length; d+=p.tasks.filter(x=>x.completed).length; });
            stats.innerHTML = `進行中: <span class="text-indigo-600">${window.projects.length}</span> 件 | 達成率: <span class="text-indigo-600">${Math.round((d/t)*100)||0}%</span>`;
            
            if (window.currentTab === 'project') window.renderProjectView(container);
            else window.renderTimelineView(container);
        };

        window.renderProjectView = (container) => {
            const sorted = [...window.projects].sort((a,b) => new Date(a.startDate) - new Date(b.startDate));
            let html = '<div class="space-y-4">';
            sorted.forEach(proj => {
                const done = proj.tasks.filter(x=>x.completed).length;
                const prog = Math.round((done/proj.tasks.length)*100)||0;
                const visibleTasks = proj.tasks.filter(t => !(t.completed && isOldTask(t.completedAt)));
                const color = proj.projectType === 'paper' ? 'rose' : 'blue';
                
                html += `
                <div class="bg-white border border-${color}-300 rounded-xl shadow-sm overflow-hidden">
                    ${proj.isEditing ? `
                    <div class="p-4 bg-slate-50 border-b border-slate-200 text-xs">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                            <div>名称: <input type="text" id="editName_${proj.id}" value="${proj.name}" class="w-full p-1.5 border rounded"></div>
                            <div class="md:col-span-2">タイトル: <input type="text" id="editTitle_${proj.id}" value="${proj.presentationTitle}" class="w-full p-1.5 border rounded"></div>
                            <div>種別: <select id="editFormat_${proj.id}" class="w-full p-1.5 border rounded">${proj.projectType==='paper'?`<option value="論文" ${proj.presentationFormat==='論文'?'selected':''}>論文</option><option value="実践報告" ${proj.presentationFormat==='実践報告'?'selected':''}>実践報告</option><option value="研究ノート" ${proj.presentationFormat==='研究ノート'?'selected':''}>研究ノート</option><option value="調査報告" ${proj.presentationFormat==='調査報告'?'selected':''}>調査報告</option>`:`<option value="口頭" ${proj.presentationFormat==='口頭'?'selected':''}>口頭</option><option value="ポスター" ${proj.presentationFormat==='ポスター'?'selected':''}>ポスター</option><option value="パネル" ${proj.presentationFormat==='パネル'?'selected':''}>パネル</option>`}</select></div>
                            <div>URL: <input type="text" id="editUrl_${proj.id}" value="${proj.url}" class="w-full p-1.5 border rounded"></div>
                            <div>メモ/地: <input type="text" id="editLocation_${proj.id}" value="${proj.location}" class="w-full p-1.5 border rounded"></div>
                            <div>日付: <input type="date" id="editStartDate_${proj.id}" value="${proj.startDate}" class="w-full p-1.5 border rounded"></div>
                        </div>
                        <div class="flex justify-end gap-2"><button onclick="cancelEdit('${proj.id}')" class="px-3 py-1 bg-white border rounded">戻る</button><button onclick="saveEdit('${proj.id}')" class="px-3 py-1 bg-indigo-600 text-white rounded">保存</button></div>
                    </div>` : `
                    <div class="p-4 flex flex-col sm:flex-row justify-between items-center cursor-pointer hover:bg-slate-50" onclick="toggleProjectExpand('${proj.id}')">
                        <div class="flex items-center gap-3">
                            <span class="text-xl">${proj.isExpanded?'🔽':'▶️'}</span>
                            <div>
                                <h3 class="text-base font-black">${proj.projectType==='paper'?'📄':'🎓'} ${proj.name} <span class="px-1.5 py-0.5 rounded border text-[9px] bg-${color}-50 text-${color}-700 border-${color}-200">${proj.presentationFormat}</span></h3>
                                <div class="text-[10px] text-slate-500 mt-0.5">${proj.startDate} | ${proj.presentationTitle || '未定'}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 mt-3 sm:mt-0">
                            ${proj.projectType==='paper'?`<button onclick="event.stopPropagation();addReviewTasks('${proj.id}')" class="text-[10px] bg-rose-100 text-rose-800 px-2 py-1 rounded font-bold">査読対応</button>`:''}
                            <span class="text-[10px] font-bold">${prog}%</span>
                            <button onclick="event.stopPropagation();startEdit('${proj.id}')">✏️</button>
                            <button onclick="event.stopPropagation();deleteProject('${proj.id}')">🗑️</button>
                        </div>
                    </div>`}
                    <div class="${proj.isExpanded && !proj.isEditing?'block':'hidden'} border-t border-slate-100">
                        <table class="w-full text-sm">
                            <tbody class="divide-y divide-slate-300">
                                ${visibleTasks.map(t => {
                                    const isPast = !t.completed && new Date(t.dueDate) < new Date(new Date().setHours(0,0,0,0));
                                    const rowColor = proj.projectType==='paper'?(t.completed?'bg-rose-50/40':'bg-rose-50/20'):(t.completed?'bg-blue-50/40':'bg-blue-50/20');
                                    return `<tr class="${rowColor} ${t.completed?'opacity-50':''}">
                                        <td class="p-3 w-10 text-center"><input type="checkbox" ${t.completed?'checked':''} onchange="toggleTask('${proj.id}','${t.id}')"></td>
                                        <td class="p-3"><input type="text" value="${t.name}" onchange="updateTaskName('${proj.id}','${t.id}',this.value)" class="w-full bg-transparent hover:bg-white/80 focus:bg-white border border-transparent hover:border-slate-300 px-1 rounded outline-none transition ${t.completed?'line-through text-slate-400':''}"></td>
                                        <td class="p-3 w-32"><input type="date" value="${t.dueDate}" onchange="updateDate('${proj.id}','${t.id}',this.value)" class="text-[11px] bg-transparent border-none ${isPast?'text-red-600 font-bold':''}"></td>
                                        <td class="p-3 w-16 text-right space-x-2">
                                            <a href="${window.getGoogleCalendarUrl(t.name, t.dueDate, proj.name, proj.presentationTitle)}" target="_blank">📅</a>
                                            <button onclick="deleteTask('${proj.id}','${t.id}')">🗑️</button>
                                        </td>
                                    </tr>`}).join('')}
                            </tbody>
                        </table>
                        <div class="p-2 bg-slate-50 flex gap-2 border-t border-slate-300"><input type="text" id="cName_${proj.id}" placeholder="新規タスク..." class="flex-1 text-xs border rounded px-2"><input type="date" id="cDate_${proj.id}" class="text-xs border rounded p-1"><button onclick="addCustomTask('${proj.id}')" class="text-xs bg-slate-700 text-white px-3 rounded">＋</button></div>
                    </div>
                </div>`;
            });
            container.innerHTML = html + '</div>';
        };

        window.renderTimelineView = (container) => {
            let all = []; 
            window.projects.forEach(p => p.tasks.forEach(t => { if (!(t.completed && isOldTask(t.completedAt))) all.push({...t, pId:p.id, pName:p.name, pType:p.projectType, pTitle:p.presentationTitle}); }));
            all.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));

            container.innerHTML = `<div class="bg-white border rounded-xl overflow-hidden shadow-sm"><table class="w-full text-sm">
                <thead class="bg-slate-900 text-white text-[10px] text-left uppercase"><tr><th class="p-3 w-10"></th><th class="p-3 w-28">期日 ▲</th><th class="p-3">内容</th><th class="p-3 w-16 text-center"></th></tr></thead>
                <tbody class="divide-y divide-slate-300">${all.map(t => {
                    const isPast = !t.completed && new Date(t.dueDate) < new Date(new Date().setHours(0,0,0,0));
                    const rowColor = t.pType==='paper'?(t.completed?'bg-rose-50/40':'bg-rose-50/30'):(t.completed?'bg-blue-50/40':'bg-blue-50/30');
                    return `<tr class="${rowColor} ${t.completed?'opacity-50':''}">
                        <td class="p-3 text-center"><input type="checkbox" ${t.completed?'checked':''} onchange="toggleTask('${t.pId}','${t.id}')"></td>
                        <td class="p-3"><input type="date" value="${t.dueDate}" onchange="updateDate('${t.pId}','${t.id}',this.value)" class="text-[11px] bg-transparent border-none ${isPast?'text-red-600 font-bold':''}"></td>
                        <td class="p-3">
                            <div class="text-[9px] font-bold opacity-60">${t.pType==='paper'?'📄':'🎓'} ${t.pName}</div>
                            <input type="text" value="${t.name}" onchange="updateTaskName('${t.pId}','${t.id}',this.value)" class="w-full bg-transparent hover:bg-white/80 focus:bg-white border border-transparent hover:border-slate-300 px-1 rounded outline-none transition text-sm ${t.completed?'line-through text-slate-400':'font-medium'}">
                        </td>
                        <td class="p-3 text-center space-x-2"><a href="${window.getGoogleCalendarUrl(t.name, t.dueDate, t.pName, t.pTitle)}" target="_blank">📅</a><button onclick="deleteTask('${t.pId}','${t.id}')">🗑️</button></td>
                    </tr>`}).join('')}</tbody></table></div>`;
        };
    </script>
</body>
</html>
