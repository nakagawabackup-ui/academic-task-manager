<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育・研究タスク管理ツール (260509-08 改正版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

<div id="app" class="max-w-5xl mx-auto p-4">
    <!-- ヘッダーと達成率 -->
    <header class="flex justify-between items-end mb-6">
        <div>
            <h1 class="text-2xl font-black">TASK MANAGER</h1>
            <p class="text-xs text-slate-500">Academic Project Management</p>
        </div>
        <div class="text-right">
            <span class="text-xs font-bold text-slate-400">CURRENT PROGRESS</span>
            <div class="text-3xl font-black" id="total-progress">0%</div>
        </div>
    </header>

    <!-- タブ切り替え -->
    <div class="flex border-b border-slate-200 mb-6 bg-white rounded-t-xl overflow-hidden shadow-sm">
        <button onclick="switchTab('timeline')" id="tab-timeline" class="flex-1 py-4 font-bold border-b-4 border-slate-900 bg-slate-50">🕒 タイムライン</button>
        <button onclick="switchTab('projects')" id="tab-projects" class="flex-1 py-4 font-bold border-b-4 border-transparent hover:bg-slate-50">📂 プロジェクト管理</button>
        <button onclick="switchTab('archive')" id="tab-archive" class="flex-1 py-4 font-bold border-b-4 border-transparent hover:bg-slate-50">🗄️ 保管庫（業績出力）</button>
    </div>

    <div id="main-content" class="min-h-[60vh]"></div>
</div>

<script>
    // --- データ構造と初期化 ---
    let projects = []; // 本来はFirestoreから取得

    // 達成率の計算（保管庫のプロジェクトは除外）
    function updateProgress() {
        const activeProjects = projects.filter(p => !p.isArchived);
        let totalTasks = 0;
        let completedTasks = 0;

        activeProjects.forEach(p => {
            p.tasks.forEach(t => {
                totalTasks++;
                if (t.completed) completedTasks++;
            });
        });

        const percent = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
        document.getElementById('total-progress').innerText = `${percent}%`;
    }

    // 日付判定関数
    function isYesterdayOrBefore(dateStr) {
        if (!dateStr) return false;
        const d = new Date(dateStr);
        d.setHours(0, 0, 0, 0);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        return d < today;
    }

    // --- 各種レンダリング関数 ---

    function renderTimeline() {
        const container = document.getElementById('main-content');
        // 昨日以前にチェックしたタスクを除外
        const allActiveTasks = [];
        projects.filter(p => !p.isArchived).forEach(p => {
            p.tasks.forEach(t => {
                const shouldHide = t.completed && isYesterdayOrBefore(t.completedAt);
                if (!shouldHide) {
                    allActiveTasks.push({ ...t, projectName: p.name });
                }
            });
        });

        // 日付順にソート
        allActiveTasks.sort((a, b) => new Date(a.date) - new Date(b.date));

        container.innerHTML = `
            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-900 text-white text-xs uppercase">
                        <tr>
                            <th class="p-4 w-12 text-center">期日</th>
                            <th class="p-4">内容</th>
                            <th class="p-4 w-12"></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${allActiveTasks.map(t => `
                            <tr class="border-b border-slate-100 hover:bg-slate-50">
                                <td class="p-4 whitespace-nowrap">
                                    <div class="flex items-center gap-2 font-mono text-sm">
                                        <span>${t.date}</span>
                                        <i data-lucide="calendar-range" class="w-4 h-4 text-blue-500 cursor-pointer hover:text-blue-700" title="期日を変更" onclick="editDate('${t.id}')"></i>
                                    </div>
                                </td>
                                <td class="p-4">
                                    <div class="text-xs text-slate-400">${t.projectName}</div>
                                    <div class="${t.completed ? 'line-through text-slate-300' : 'font-bold'}">${t.text}</div>
                                </td>
                                <td class="p-4">
                                    <i data-lucide="external-link" class="w-4 h-4 text-slate-300 cursor-pointer hover:text-blue-500" title="Googleカレンダーに転記" onclick="syncToGoogle('${t.id}')"></i>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
        lucide.createIcons();
    }

    // 他のタブ（プロジェクト別・保管庫）も同様に「`.innerHTML = ... ;` の直後に `lucide.createIcons();`」を配置します。

    function switchTab(tab) {
        // タブのデザイン切り替えロジック
        document.querySelectorAll('button[id^="tab-"]').forEach(btn => {
            btn.classList.remove('border-slate-900', 'bg-slate-50');
            btn.classList.add('border-transparent');
        });
        document.getElementById(`tab-${tab}`).classList.add('border-slate-900', 'bg-slate-50');
        document.getElementById(`tab-${tab}`).classList.remove('border-transparent');

        if (tab === 'timeline') renderTimeline();
        // if (tab === 'projects') renderProjects();
        // if (tab === 'archive') renderArchive();
    }

    // 初期起動
    window.onload = () => {
        updateProgress();
        renderTimeline();
    };

</script>
</body>
</html>
